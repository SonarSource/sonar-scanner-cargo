[package]
name = "cargo-sonar-scanner"
version = "0.1.0"
edition = "2024"
# Verified by CI, not asserted: `let` chains put the floor at 1.88.
rust-version = "1.88"
description = "Run SonarQube Server and SonarQube Cloud analysis from Cargo."
# Sonar Source-Available License v1.0 — not an SPDX identifier, so the text ships with the crate.
license-file = "LICENSE.txt"
readme = "README.md"
repository = "https://github.com/SonarSource/sonar-scanner-cargo"
documentation = "https://docs.rs/cargo-sonar-scanner"
categories = ["development-tools", "development-tools::cargo-plugins"]
keywords = ["sonarqube", "sonar", "static-analysis", "code-quality", "cargo-subcommand"]
# An allowlist, not a destination: crates.io is the only registry this crate may be published to.
# CI does not publish with Cargo — it uploads the packaged crate with the JFrog CLI.
publish = ["crates-io"]
# A published .crate is public and immutable: list what goes in it explicitly, rather than
# excluding what must stay out and hoping the list stays complete.
include = [
    "/src",
    "/tests",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE.txt",
    "/NOTICE.txt",
    "/rust-toolchain.toml",
    "/rustfmt.toml",
]

[[bin]]
name = "cargo-sonar-scanner"
path = "src/main.rs"

[features]
# Build OpenSSL from source and link it statically, for the released Linux binaries only.
#
# `native-tls` resolves to Security.framework on macOS and SChannel on Windows, both provided by the
# OS. On Linux it resolves to OpenSSL, so a binary built against the runner's libssl only runs where
# that exact soname exists. Vendoring makes one Linux binary per architecture that runs anywhere,
# which is the whole point of shipping one. `openssl-probe` still locates the system CA bundle at
# runtime, so the OS trust store — the reason `native-tls` was chosen — keeps working.
#
# Off by default: `cargo install` builds for the machine it runs on, where the system OpenSSL is the
# right answer and a source build is a slow surprise.
vendored-openssl = ["dep:openssl"]

[dependencies]
# Only to PEM-encode the client key from the keystore. `ureq` takes the key as DER too, but the
# `KeyKind` that constructor needs is not re-exported, so PEM is the only reachable route. See
# src/http.rs.
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
# The pure-Rust inflate backend: the release build cross-compiles, and a C dependency would need a
# toolchain per target.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
log = "0.4"
# Reads `sonar.scanner.truststorePath` and `keystorePath`, which the bootstrapping contract requires
# the bootstrapper to honour for its own calls, not merely forward. Pure Rust, so it costs the
# cross-compiled targets nothing.
p12-keystore = "0.3"
# A truststore is additive — "in addition to OS + built-in certificates" — but `ureq` cannot express
# "the platform verifier and also these": naming roots turns the built-in ones off. So the platform's
# roots are enumerated here and passed alongside the truststore's. See src/tls.rs.
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Used by the cache to write a downloaded artefact beside its final location: `O_EXCL` creation,
# removal on every failure path, and a no-clobber rename are all needed and all platform-specific.
tar = "0.4"
tempfile = "3"
thiserror = "2"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
# `native-tls` rather than the default rustls: the OS trust store is what makes a corporate
# TLS-intercepting proxy work without extra configuration. The client pins the root certificates to
# the platform verifier, see src/http.rs.
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
# Resolving a `Location` header and comparing origins are both RFC 3986 problems, and the token rule
# in src/http.rs depends on getting them right. Neither is worth reimplementing.
url = "2"
# Deflate is the only method a JRE archive uses; the rest of the compression zoo stays out of the
# binary, and out of the dependency audit.
zip = { version = "8", default-features = false, features = ["deflate"] }

# Not called from any code: depending on it is how the `vendored` feature reaches the `openssl-sys`
# that `native-tls` pulls in, since Cargo unifies features across the graph. Linux-only, because it
# is the only platform whose `native-tls` uses OpenSSL at all.
[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10", features = ["vendored"], optional = true }

[profile.release]
strip = true

[dev-dependencies]
# Generates a throwaway certificate and key per test, so most PKCS#12 fixtures are built at run time
# rather than committed with a private key in a public repository. One certificate-only truststore
# is committed deliberately instead — see tests/fixtures/README.md for why.
rcgen = "0.14"
