[package]
name = "cargo-sonar-scanner"
version = "0.1.0"
edition = "2024"
# Verified by CI, not asserted: `let` chains put the floor at 1.88.
rust-version = "1.88"
description = "Run SonarQube Server and SonarQube Cloud analysis from Cargo."
# Sonar Source-Available License v1.0 — not an SPDX identifier, so the text ships with the crate.
license-file = "LICENSE.txt"
readme = "README.md"
repository = "https://github.com/SonarSource/sonar-scanner-cargo"
documentation = "https://docs.rs/cargo-sonar-scanner"
categories = ["development-tools", "development-tools::cargo-plugins"]
keywords = ["sonarqube", "sonar", "static-analysis", "code-quality", "cargo-subcommand"]
publish = ["crates-io"]
# A published .crate is public and immutable: list what goes in it explicitly, rather than
# excluding what must stay out and hoping the list stays complete.
include = [
    "/src",
    "/tests",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE.txt",
    "/NOTICE.txt",
    "/rust-toolchain.toml",
    "/rustfmt.toml",
]

[[bin]]
name = "cargo-sonar-scanner"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Used by the cache to write a downloaded artefact beside its final location: `O_EXCL` creation,
# removal on every failure path, and a no-clobber rename are all needed and all platform-specific.
tempfile = "3"
thiserror = "2"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
# `native-tls` rather than the default rustls: the OS trust store is what makes a corporate
# TLS-intercepting proxy work without extra configuration. The client pins the root certificates to
# the platform verifier, see src/http.rs.
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }
# Resolving a `Location` header and comparing origins are both RFC 3986 problems, and the token rule
# in src/http.rs depends on getting them right. Neither is worth reimplementing.
url = "2"

[profile.release]
strip = true
