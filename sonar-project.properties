# Analysis of this repository itself, on SonarQube (NEXT), SonarQube Cloud EU and US.
#
# The project key also tells the organisation-wide `check-sca` workflow which SonarQube project to
# read dependency-analysis results from, so it has to live in this file: that check discovers the
# key from sonar-project.properties, pom.xml, build.gradle or .sonarlint, and has no notion of
# Cargo manifests. Once this repository dogfoods `cargo sonar-scanner` on itself, the analysis
# configuration can move to [package.metadata.sonar] in Cargo.toml, but the key has to stay
# discoverable here or be passed to the check explicitly.
sonar.projectKey=SonarSource_sonar-scanner-cargo
sonar.organization=sonarsource

sonar.sources=src
sonar.tests=tests
sonar.exclusions=target/**
# The fixtures under tests/ are analysis input, not our code, and some of them carry a deliberate
# smell so that tests/e2e.rs can assert a rule fired. Analysing them here would report those planted
# issues against this project and fail our own quality gate.
sonar.test.exclusions=tests/fixtures/**

sonar.links.scm=https://github.com/SonarSource/sonar-scanner-cargo
sonar.links.issue=https://sonarsource.atlassian.net/browse/SCANCARGO
