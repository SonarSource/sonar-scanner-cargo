---
name: Pull Request Closed
# yamllint disable-line rule:truthy
on:
  pull_request:
    types: [closed]

# Moves the issue on with the merge transition once the pull request closes.
#
# `fix-version` is deliberately not set. It names the version to stamp on issues that have none, and
# this project has released nothing yet, so there is no version to autodetect. Set it once the first
# release exists.
jobs:
  PullRequestClosed_job:
    name: Pull Request Closed
    runs-on: sonar-xs
    permissions:
      id-token: write
      pull-requests: read
    # A fork cannot reach Vault, so there is no token to act with; move the ticket by hand instead.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - id: secrets
        uses: SonarSource/vault-action-wrapper@a7fa5fd4a4e4e0f2593f6137c0812cac196cf4ce # 3.7.0
        with:
          secrets: |
            development/kv/data/jira user | JIRA_USER;
            development/kv/data/jira token | JIRA_TOKEN;

      # Tracked by major version rather than by commit: this action is our own, and we want its
      # fixes without waiting for someone to bump a pin.
      - uses: sonarsource/gh-action-lt-backlog/PullRequestClosed@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          jira-user: ${{ fromJSON(steps.secrets.outputs.vault).JIRA_USER }}
          jira-token: ${{ fromJSON(steps.secrets.outputs.vault).JIRA_TOKEN }}
