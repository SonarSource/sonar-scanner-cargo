---
name: Submit Review
# yamllint disable-line rule:truthy
on:
  pull_request_review:
    types: [submitted]

# Moves the issue through the "Approved" or "Request Changes" transition once a review lands. Only
# those two review states carry a decision — a plain comment leaves the issue where it is.
jobs:
  SubmitReview_job:
    name: Submit Review
    runs-on: sonar-xs
    permissions:
      id-token: write
    # A fork cannot reach Vault, so there is no token to act with; move the ticket by hand instead.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && (github.event.review.state == 'changes_requested'
          || github.event.review.state == 'approved')
    steps:
      - id: secrets
        uses: SonarSource/vault-action-wrapper@0a3114fe1230b784c35b53b099f9ab1f1e538cc7 # 3.5.0
        with:
          secrets: |
            development/github/token/{REPO_OWNER_NAME_DASH}-jira token | GITHUB_TOKEN;
            development/kv/data/jira user | JIRA_USER;
            development/kv/data/jira token | JIRA_TOKEN;

      # Tracked by major version rather than by commit: this action is our own, and we want its
      # fixes without waiting for someone to bump a pin.
      - uses: sonarsource/gh-action-lt-backlog/SubmitReview@v2
        with:
          github-token: ${{ fromJSON(steps.secrets.outputs.vault).GITHUB_TOKEN }}
          jira-user: ${{ fromJSON(steps.secrets.outputs.vault).JIRA_USER }}
          jira-token: ${{ fromJSON(steps.secrets.outputs.vault).JIRA_TOKEN }}
