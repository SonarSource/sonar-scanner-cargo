name: Build
on:
  push:
    branches:
      - master
      - branch-*
      - dogfood-*
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Taken once per run, so that the deploy and the promotion agree on the build.
  get-build-number:
    runs-on: sonar-xs
    name: Get build number
    permissions:
      id-token: write
    outputs:
      BUILD_NUMBER: ${{ steps.get-build-number.outputs.BUILD_NUMBER }}
    steps:
      - uses: SonarSource/ci-github-actions/get-build-number@983645f538ff01044b1e567adb23e6f527d8b52a # 1.8.9
        id: get-build-number

  build:
    # For guidance on runner selection, visit:
    # https://xtranet-sonarsource.atlassian.net/wiki/spaces/Platform/pages/3694231566/GitHub+Actions+Runner+-+GitHub
    runs-on: sonar-xs
    name: Build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # SECURITY BEST PRACTICES:
      # - Pin third-party actions to specific SHA commits, not tags. A SonarSource action may track
      #   a major version instead, so that its fixes arrive without waiting for someone to bump a pin
      # - All secrets MUST come from Vault using SonarSource/vault-action-wrapper
      # - Never use GitHub Secrets for sensitive data

      # The sonar-* runners are minimal, so the Rust toolchain is provisioned by mise rather
      # than by the system package manager.
      - name: Set up tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.7.7

      - name: Check the pinned Rust version is consistent
        run: |
          mise_version=$(sed -n 's/^rust *= *"\(.*\)"/\1/p' mise.toml)
          toolchain_version=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          if [[ "$mise_version" != "$toolchain_version" ]]; then
            echo "::error::mise.toml pins Rust $mise_version but rust-toolchain.toml pins $toolchain_version"
            exit 1
          fi
          echo "Rust $mise_version"
          cargo --version
          rustc --version

      - name: Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@0a3114fe1230b784c35b53b099f9ab1f1e538cc7 # 3.5.0
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-public-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      # Dependencies resolve through Repox rather than crates.io directly. This file is generated
      # here and never committed: committing it would break external contributors, who have no
      # Repox credentials.
      - name: Route crates.io through Repox
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [registry]
          # Repox requires authentication, and Cargo refuses to talk to an authenticated registry
          # without an explicit credential provider. The token comes from the environment.
          global-credential-providers = ["cargo:token"]

          [registries.repox]
          index = "sparse+https://repox.jfrog.io/artifactory/api/cargo/crates-io/index/"

          [source.crates-io]
          replace-with = "repox"
          EOF

      - name: Check the formatting
        run: cargo fmt --all --check

      - name: Check the license headers
        run: |
          missing=$(grep -rL 'Sonar Source-Available License Version 1' --include='*.rs' src tests || true)
          if [[ -n "$missing" ]]; then
            echo "::error::Missing the license-header.txt header:"
            echo "$missing"
            exit 1
          fi

      - name: Lint
        env:
          CARGO_REGISTRIES_REPOX_TOKEN: Bearer ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        env:
          CARGO_REGISTRIES_REPOX_TOKEN: Bearer ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: cargo build --locked

      - name: Test
        env:
          CARGO_REGISTRIES_REPOX_TOKEN: Bearer ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: cargo test --locked

      # The MSRV is a promise to anyone running `cargo install`, so compile it rather than assert it.
      # The version comes from Cargo.toml so there is only one place to change it.
      - name: Verify the declared MSRV
        env:
          CARGO_REGISTRIES_REPOX_TOKEN: Bearer ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [[ -z "$msrv" ]]; then
            echo "::error::Cargo.toml declares no rust-version"
            exit 1
          fi
          echo "Declared MSRV: $msrv"
          mise x "rust@$msrv" -- cargo check --locked --all-targets

      # A published .crate is immutable, so review what would go into it on every build. This is
      # the control that stops credentials or internal material leaking into a public artifact.
      - name: Inspect the package contents
        run: cargo package --list --locked

      # `--list` prints files but never validates the manifest for a registry. The dry run packages
      # the crate and builds it in isolation, so a missing field or a path dependency fails here
      # rather than on the one publish that cannot be taken back. The registry is named explicitly
      # because a default registry in the environment is rejected against `package.publish`.
      - name: Validate the crate for publication
        env:
          CARGO_REGISTRIES_REPOX_TOKEN: Bearer ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: cargo publish --dry-run --locked --registry crates-io

  # Prebuilt binaries, so that using the scanner does not require compiling it.
  #
  # `native-tls` decides the shape of this matrix, because it resolves to a different library per
  # platform: OpenSSL on Linux, SChannel on Windows, Security.framework on macOS.
  #
  # Linux and Windows cross-compile from one runner with cargo-zigbuild, as sonar-rust-enterprise
  # does. Zig is the C compiler that builds OpenSSL for the Linux targets (`vendored-openssl`, see
  # Cargo.toml), and it ships the mingw import libraries that SChannel needs, so Windows needs no
  # toolchain of its own — and no Windows runner. macOS builds natively: linking
  # Security.framework wants the real SDK.
  #
  # Linux ships musl only. A static musl binary runs on glibc systems too, so a separate gnu build
  # would be a second artefact with no additional reach.
  #
  # Windows is the `gnu` target rather than `msvc` for the same reason: `msvc` needs `link.exe`,
  # which means a Windows runner with Visual Studio on it.
  #
  # Every target is built on every run, including pull requests. This matrix is new and each leg is
  # the only thing standing between a broken target and a user who downloads it; trim it to one leg
  # on pull requests if the runner cost becomes the greater concern.
  binaries:
    needs: get-build-number
    name: Binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: sonar-m
          - target: aarch64-unknown-linux-musl
            runner: sonar-m
          - target: x86_64-pc-windows-gnu
            runner: sonar-m
          - target: x86_64-apple-darwin
            runner: macos-latest-large
          - target: aarch64-apple-darwin
            runner: macos-latest-xlarge
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # zig is only needed by the legs that cross-compile, so it is not installed on the macOS
      # runners, which build natively.
      - name: Pin zig for the cross-compiled targets
        if: ${{ !contains(matrix.target, 'apple') }}
        run: |
          cat > mise.local.toml <<'EOF'
          [tools]
          zig = "0.13"
          "cargo:cargo-zigbuild" = "0.23.3"
          EOF

      - name: Set up tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.7.7

      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@0a3114fe1230b784c35b53b099f9ab1f1e538cc7 # 3.5.0
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-public-reader access_token | ARTIFACTORY_ACCESS_TOKEN;

      - name: Route crates.io through Repox
        shell: bash
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [registry]
          global-credential-providers = ["cargo:token"]

          [registries.repox]
          index = "sparse+https://repox.jfrog.io/artifactory/api/cargo/crates-io/index/"

          [source.crates-io]
          replace-with = "repox"
          EOF

      # Only Linux needs `vendored-openssl`: it is the one target family whose `native-tls` has a
      # library to compile. Windows links SChannel, whose import libraries zig ships.
      - name: Build (cross-compiled)
        if: ${{ !contains(matrix.target, 'apple') }}
        shell: bash
        env:
          CARGO_REGISTRIES_REPOX_TOKEN: Bearer ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: |
          features=()
          [[ "${{ matrix.target }}" == *linux* ]] && features=(--features vendored-openssl)
          cargo zigbuild --release --locked "${features[@]}" --target ${{ matrix.target }}

      - name: Build (macOS)
        if: contains(matrix.target, 'apple')
        shell: bash
        env:
          CARGO_REGISTRIES_REPOX_TOKEN: Bearer ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_ACCESS_TOKEN }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The licence has to travel with the binary: someone who downloads an archive never sees the
      # repository or the crate.
      - name: Stage the archive contents
        shell: bash
        run: |
          stage="cargo-sonar-scanner-${{ matrix.target }}"
          suffix=""
          [[ "${{ matrix.target }}" == *windows* ]] && suffix=".exe"
          mkdir -p "dist/$stage"
          cp "target/${{ matrix.target }}/release/cargo-sonar-scanner$suffix" "dist/$stage/"
          cp LICENSE.txt NOTICE.txt README.md "dist/$stage/"
          echo "STAGE=$stage" >> "$GITHUB_ENV"

      # Unversioned here: the deploy job owns the version, so that only one place derives it.
      - name: Pack (tar.gz)
        if: ${{ !contains(matrix.target, 'windows') }}
        shell: bash
        run: tar -czf "dist/${STAGE}.tar.gz" -C dist "$STAGE"

      # A zip rather than a tarball, because that is what a Windows user expects to be handed, even
      # though it is now built on Linux. `zip` is not on a minimal runner by default, so fall back to
      # Python's, and fail loudly rather than silently shipping no Windows archive.
      - name: Pack (zip)
        if: contains(matrix.target, 'windows')
        shell: bash
        run: |
          cd dist
          if command -v zip > /dev/null; then
            zip -qr "${STAGE}.zip" "$STAGE"
          elif command -v python3 > /dev/null; then
            python3 -m zipfile -c "${STAGE}.zip" "$STAGE"
          else
            echo "::error::neither zip nor python3 is available to build the Windows archive"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # Analysis of this repository itself. Dependency analysis (SCA) runs as part of the SonarQube
  # scan, which is what the organisation-wide `check-sca` workflow waits for — it polls the
  # project's default branch and the pull request, so a PR analysis is enough to satisfy it.
  #
  # Deliberately independent of `build`: a failing lint should not hide the analysis result, and
  # the scan needs no Rust toolchain — the analyzers ship with the scanner engine.
  sonar:
    runs-on: sonar-xs
    name: SonarQube Analysis
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Full history, so that SCM blame and new-code detection work.
          fetch-depth: 0

      - name: Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@0a3114fe1230b784c35b53b099f9ab1f1e538cc7 # 3.5.0
        with:
          secrets: |
            development/kv/data/next url | SONAR_HOST_URL;
            development/kv/data/next token | SONAR_TOKEN;

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          # Needed to decorate the pull request.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ fromJSON(steps.secrets.outputs.vault).SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.analysis.pipeline=${{ github.run_id }}
            -Dsonar.analysis.repository=${{ github.repository }}

  # A release is a promotion, never a rebuild: every build deploys to the `-qa` repository and is
  # promoted out of it — a pull request to `-dev`, master to `-builds`, and release.yml from
  # `-builds` to `-releases`. Promotion moves what a JFrog build info records, and `cargo publish`
  # cannot produce one, so the crate is uploaded with the JFrog CLI, on the layout Artifactory
  # indexes crates from: `crates/<name>/<name>-<version>.crate`.
  #
  # Crate versions are immutable, so each build takes its own, `<version>-<build number>`.
  deploy:
    needs: [build, binaries, get-build-number]
    # Forks are excluded: they cannot reach Vault, so there is no deploy token for them.
    if: >-
      github.ref == 'refs/heads/master'
      || (github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: sonar-xs
    name: Deploy
    permissions:
      id-token: write
      contents: read
    env:
      # The release looks the build info up by repository name.
      BUILD_NAME: ${{ github.event.repository.name }}
      BUILD_NUMBER: ${{ needs.get-build-number.outputs.BUILD_NUMBER }}
      # The public lifecycle, matching this repository's visibility.
      ARTIFACTORY_DEPLOY_REPO: sonarsource-cargo-public-qa
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # mise provisions the JFrog CLI alongside Rust; CI-only, so the file is not committed.
      - name: Pin the JFrog CLI
        run: |
          cat > mise.local.toml <<'EOF'
          [tools]
          jfrog-cli = "2.115.0"

          [env]
          JFROG_CLI_AVOID_NEW_VERSION_WARNING = "true"
          JFROG_CLI_ENV_EXCLUDE = "*password*;*secret*;*key*;*token*;*auth*;*credential*"
          EOF

      - name: Set up tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
        with:
          version: 2026.7.7

      - name: Vault
        id: secrets
        uses: SonarSource/vault-action-wrapper@0a3114fe1230b784c35b53b099f9ab1f1e538cc7 # 3.5.0
        with:
          secrets: |
            development/artifactory/token/{REPO_OWNER_NAME_DASH}-qa-deployer access_token | ARTIFACTORY_DEPLOY_TOKEN;

      # Only for resolving dependencies while packaging; the deploy goes through the JFrog CLI.
      - name: Route crates.io through Repox
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [registry]
          global-credential-providers = ["cargo:token"]

          [registries.repox]
          index = "sparse+https://repox.jfrog.io/artifactory/api/cargo/crates-io/index/"

          [source.crates-io]
          replace-with = "repox"
          EOF

      # Cargo has no flag for a build number, and `--locked` compares the manifest version against
      # Cargo.lock, so both files move together.
      - name: Stamp the build version
        run: |
          release=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ -z "$release" ]]; then
            echo "::error::Cargo.toml declares no version"
            exit 1
          fi
          version="${release}-${BUILD_NUMBER}"
          # The package's own version only: the first in Cargo.toml, the line after its name in
          # Cargo.lock. Dependency versions are left be.
          awk -v v="$version" '!done && /^version = /{print "version = \"" v "\""; done=1; next} {print}' \
            Cargo.toml > Cargo.toml.stamped && mv Cargo.toml.stamped Cargo.toml
          awk -v v="$version" '/^name = "cargo-sonar-scanner"$/{print; getline; print "version = \"" v "\""; next} {print}' \
            Cargo.lock > Cargo.lock.stamped && mv Cargo.lock.stamped Cargo.lock
          # Reaches the build info via `jf rt build-collect-env` below, where the promotion and the
          # release read it back.
          echo "PROJECT_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building $BUILD_NAME/$BUILD_NUMBER as $version"

      # `--allow-dirty`: the stamp above edits the manifest. The verification build is kept — it is
      # the last check that the packaged crate compiles on its own.
      - name: Package the crate
        env:
          CARGO_REGISTRIES_REPOX_TOKEN: Bearer ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_DEPLOY_TOKEN }}
        run: cargo package --locked --allow-dirty

      - name: Collect the prebuilt binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true

      # Named with the version only now, so the binaries job never has to derive one. The checksum
      # is generated here rather than per-runner so that all of them come from one implementation.
      - name: Name and checksum the binaries
        run: |
          cd binaries
          for archive in *; do
            case "$archive" in
              cargo-sonar-scanner-*.tar.gz) target="${archive#cargo-sonar-scanner-}"; target="${target%.tar.gz}"; ext="tar.gz" ;;
              cargo-sonar-scanner-*.zip)    target="${archive#cargo-sonar-scanner-}"; target="${target%.zip}";    ext="zip" ;;
              *) echo "::error::unexpected artefact $archive"; exit 1 ;;
            esac
            mv "$archive" "cargo-sonar-scanner-${PROJECT_VERSION}-${target}.${ext}"
          done
          # Written outside the directory first: redirecting into it would have the shell create the
          # file before the glob expands, and the checksum list would contain itself.
          sha256sum cargo-sonar-scanner-* > ../checksums
          mv ../checksums "cargo-sonar-scanner-${PROJECT_VERSION}.sha256"
          ls -l

      - name: Deploy to Repox
        env:
          ARTIFACTORY_DEPLOY_TOKEN: ${{ fromJSON(steps.secrets.outputs.vault).ARTIFACTORY_DEPLOY_TOKEN }}
        run: |
          jf config remove repox > /dev/null 2>&1 || true
          jf config add repox \
            --url https://repox.jfrog.io \
            --artifactory-url https://repox.jfrog.io/artifactory \
            --access-token "$ARTIFACTORY_DEPLOY_TOKEN"
          jf config use repox
          crate="cargo-sonar-scanner-${PROJECT_VERSION}.crate"
          dir="crates/cargo-sonar-scanner"
          # --flat, or the source hierarchy is preserved and the crate lands under a `target/package`
          # of its own. --fail-no-op, or an empty build info would silently promote nothing.
          jf rt upload --flat=true --fail-no-op \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            "target/package/$crate" "${ARTIFACTORY_DEPLOY_REPO}/${dir}/"
          # A crate anywhere but `crates/<name>/<name>-<version>.crate` is stored but never indexed,
          # so it would be published and still unresolvable.
          if ! jf rt search "${ARTIFACTORY_DEPLOY_REPO}/${dir}/${crate}" | grep -q "$crate"; then
            echo "::error::${dir}/${crate} is not in ${ARTIFACTORY_DEPLOY_REPO}"
            exit 1
          fi
          # Same build info as the crate, so a release promotes the binaries with it rather than
          # leaving them behind in `-qa`. No index layout to respect here: unlike the crate, nothing
          # resolves these by path.
          jf rt upload --flat=true --fail-no-op \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            "binaries/*" "${ARTIFACTORY_DEPLOY_REPO}/binaries/cargo-sonar-scanner/${PROJECT_VERSION}/"
          jf rt build-collect-env "$BUILD_NAME" "$BUILD_NUMBER"
          jf rt build-add-git "$BUILD_NAME" "$BUILD_NUMBER"
          jf rt build-publish "$BUILD_NAME" "$BUILD_NUMBER"

      - name: Summarise
        run: |
          echo "Deployed \`cargo-sonar-scanner $PROJECT_VERSION\` to \`$ARTIFACTORY_DEPLOY_REPO\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Build info: \`$BUILD_NAME/$BUILD_NUMBER\`" >> "$GITHUB_STEP_SUMMARY"

  # Promotes out of `-qa` — to `-dev` for a pull request, to `-builds` for master — and puts the
  # build version on the commit as a GitHub status. BUILD_NUMBER is passed in so that the action
  # promotes the build the deploy job published rather than taking a fresh number.
  promote:
    needs: [deploy, get-build-number]
    runs-on: sonar-xs
    name: Promote
    permissions:
      id-token: write
      contents: write  # the permission set the action documents
    env:
      BUILD_NUMBER: ${{ needs.get-build-number.outputs.BUILD_NUMBER }}
    steps:
      - name: Promote out of sonarsource-cargo-public-qa
        uses: SonarSource/ci-github-actions/promote@983645f538ff01044b1e567adb23e6f527d8b52a # 1.8.9
        with:
          artifactory-deploy-repo: sonarsource-cargo-public-qa
          promote-pull-request: 'true'
