---
name: Release
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version to release, e.g. 0.1.0-42 (see the Deploy job summary of the master build)'
        required: true
        type: string
      publishToCratesIo:
        description: 'Actually publish the crate to crates.io. IRREVERSIBLE — a published version can
          never be replaced or removed, only yanked. Has no effect when dryRun is on.'
        required: false
        type: boolean
        default: false
      dryRun:
        description: 'Rehearse without releasing. Skips releasability, the promotion and the GitHub
          release, and always runs the crates.io job as `cargo publish --dry-run` — no flag to
          remember, and nothing is uploaded.'
        required: false
        type: boolean
        default: false

# Releasing does not build: build.yml has already deployed the crate and promoted it to `-builds`.
# The reusable workflow below finds that build by the trailing number of the version input and
# promotes it to `-releases`, so only a version a master build produced can be released.
#
# Three destinations. Repox is the promotion and is repeatable. binaries.sonarsource.com is a copy
# of what was promoted, and a revoked release deletes it again. crates.io is public and immutable,
# so the real publish there is opt-in per run — a rehearsal of it is not: the reusable workflow runs
# the crates.io job on every dry run, whatever publishToCratesIo says.
jobs:
  release:
    permissions:
      id-token: write
      contents: write
    # TODO: pinned to the head of gh-action_release PR #413, which adds publishToCratesIo and the
    # `{ build }` substitution the binstall metadata depends on. Swap for the release tag that
    # contains it as soon as that PR is merged and gh-action_release is tagged.
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@238284debef0db6907e4f08ddea9529261779bd5
    with:
      version: ${{ inputs.version }}
      publishToCratesIo: ${{ inputs.publishToCratesIo }}
      # Copies the prebuilt archives from Repox to binaries.sonarsource.com, where they are the only
      # way to obtain the scanner without compiling it — and where `cargo binstall` looks for them.
      # See [package.metadata.binstall] in Cargo.toml.
      publishToBinaries: true
      dryRun: ${{ inputs.dryRun }}
