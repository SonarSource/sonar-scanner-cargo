---
name: Release
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version to release, e.g. 0.1.0-42 (see the Deploy job summary of the master build)'
        required: true
        type: string

# Releasing does not build anything. build.yml has already deployed the crate to
# sonarsource-cargo-public-qa and promoted it to sonarsource-cargo-public-builds; the reusable
# workflow below looks the build info up as sonar-scanner-cargo/<build number> — the trailing
# number of the version input — and promotes that same build to sonarsource-cargo-public-releases
# with status `released`, after the releasability checks pass.
#
# It follows that a version can only be released if a master build produced it: the version input
# must be one Repox already knows, not a number invented here.
#
# Publishing to crates.io is not wired yet (SCANCARGO-8) and will be automatic when it is, the way
# the other scanners reach PyPI and npmjs: gh-action_release takes a `publishToPyPI` /
# `publishToNpmJS` flag and does the public publication itself, so the equivalent Cargo flag
# belongs there rather than in a hand-rolled job here.
jobs:
  release:
    permissions:
      id-token: write
      contents: write
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@0c9c1cc54cbdd24258f135601d1b77cfc87e67ae # 7.4.0
    with:
      version: ${{ inputs.version }}
