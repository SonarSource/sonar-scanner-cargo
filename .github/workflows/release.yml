---
name: Release
# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Build version to release, e.g. 0.1.0-42 (see the Deploy job summary of the master build)'
        required: true
        type: string
      publishToCratesIo:
        description: 'Actually publish the crate to crates.io. IRREVERSIBLE — a published version can
          never be replaced or removed, only yanked. Has no effect when dryRun is on.'
        required: false
        type: boolean
        default: false
      dryRun:
        description: 'Rehearse without releasing. Skips releasability, the promotion and the GitHub
          release, and always runs the crates.io job as `cargo publish --dry-run` — no flag to
          remember, and nothing is uploaded.'
        required: false
        type: boolean
        default: false

# Releasing does not build: build.yml has already deployed the crate and promoted it to `-builds`.
# The reusable workflow below finds that build by the trailing number of the version input and
# promotes it to `-releases`, so only a version a master build produced can be released.
#
# Two destinations, deliberately decoupled. Repox is the promotion and is repeatable. crates.io is
# public and immutable, so the real publish is opt-in per run — but a rehearsal of it is not, see
# the pass-through below.
jobs:
  release:
    permissions:
      id-token: write
      contents: write
    # TODO: pinned to the head of gh-action_release PR #413, which adds publishToCratesIo. Swap for
    # the release tag that contains it as soon as that PR is merged and gh-action_release is tagged.
    uses: SonarSource/gh-action_release/.github/workflows/main.yaml@fe21ded32d0763fdb77a13be883532706476296c
    with:
      version: ${{ inputs.version }}
      # A dry run always exercises the crates.io job, whatever the publish flag says. The job is
      # gated upstream on publishToCratesIo alone, so passing the operator's flag through unchanged
      # would make `dryRun: true, publishToCratesIo: false` skip it and rehearse nothing — a green
      # run that proves the one irreversible step was never tried. Under dryRun the job runs as
      # `cargo publish --dry-run`, which fetches no crates.io token and uploads nothing, so turning
      # it on here costs only runner time.
      publishToCratesIo: ${{ inputs.publishToCratesIo || inputs.dryRun }}
      dryRun: ${{ inputs.dryRun }}
